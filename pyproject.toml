[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-entity-resolution"
version = "0.1.0"
description = "Evidence-first domain entity resolution service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.10,<26.0",
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "domain_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: requires a real PostgreSQL database configured by DERE_TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.black]
line-length = 100
target-version = ["py312"]
